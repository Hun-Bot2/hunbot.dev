name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Node 24 matches the Vercel serverless runtime. Building on a newer local
      # version can hide failures that only appear on the deploy target.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Source-level checks run before the build so a content or boundary error
      # fails in seconds rather than after a full build.
      - name: Validate content
        run: npm run content:validate

      - name: Validate product boundaries
        run: npm run product:validate

      - name: Validate CSP and third-party inventory
        run: npm run csp:validate

      - name: Validate view counter contract
        run: npm run views:validate

      - name: Unit tests
        run: node --test test/

      # The build has no secrets: the only serverless route is prerender=false,
      # so Redis is never contacted here. It must succeed without credentials.
      - name: Build
        run: npm run build

      # These read generated output and must run after the build.
      - name: Validate blog listing
        run: npm run blog:listing:validate

      - name: Validate routes
        run: npm run routes:validate

      - name: Validate SEO
        run: npm run seo:validate

      - name: Validate UI and accessibility
        run: npm run ui:validate

      - name: Validate search index
        run: npm run search:validate

      - name: Validate homepage
        run: npm run homepage:validate

      - name: Validate library page
        run: npm run library-page:validate

      - name: Performance budget
        run: npm run perf:budget

      - name: Validate internal links
        run: npm run links:validate
