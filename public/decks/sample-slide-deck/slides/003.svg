<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
	<title id="title">Sample Slide Deck, slide 3</title>
	<desc id="desc">A slide summarizing security rules for presentation embeds.</desc>
	<rect width="1600" height="900" fill="#f8fafc" />
	<rect x="96" y="96" width="1408" height="708" rx="24" fill="#0f172a" />
	<text x="160" y="240" fill="#fdba74" font-family="Arial, sans-serif" font-size="56" font-weight="700">Security defaults</text>
	<text x="160" y="370" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52">Local metadata only</text>
	<text x="160" y="465" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52">No arbitrary remote URLs</text>
	<text x="160" y="560" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52">No PPTX inline rendering</text>
	<text x="160" y="655" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52">No upload or conversion backend</text>
</svg>
