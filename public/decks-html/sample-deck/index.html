<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sample Presentation</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			body {
				align-items: center;
				background: #0f172a;
				color: #f8fafc;
				display: flex;
				min-height: 100vh;
				margin: 0;
			}

			main {
				box-sizing: border-box;
				margin: 0 auto;
				max-width: 960px;
				padding: 7vw;
				width: 100%;
			}

			p {
				color: #fdba74;
				font-size: clamp(1rem, 2vw, 1.25rem);
				font-weight: 700;
				margin: 0 0 1rem;
				text-transform: uppercase;
			}

			h1 {
				font-size: clamp(2rem, 6vw, 4.5rem);
				line-height: 1;
				margin: 0;
			}

			ul {
				color: #cbd5e1;
				font-size: clamp(1rem, 2vw, 1.35rem);
				line-height: 1.6;
				margin: 2rem 0 0;
				padding-left: 1.25rem;
			}
		</style>
	</head>
	<body>
		<main>
			<p>Backendless deck</p>
			<h1>Sample Presentation</h1>
			<ul>
				<li>Local HTML served from <code>/public/decks-html/</code>.</li>
				<li>Embedded with a sandboxed iframe.</li>
				<li>No document server or external viewer.</li>
			</ul>
		</main>
	</body>
</html>
